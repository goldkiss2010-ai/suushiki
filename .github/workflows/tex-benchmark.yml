name: Reproduce LuaLaTeX reference

on:
  workflow_dispatch:

jobs:
  tex-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install LuaLaTeX and Japanese typesetting packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-luatex texlive-lang-japanese texlive-latex-recommended \
            texlive-fonts-recommended
      - name: Record current implementation versions
        run: |
          lualatex --version | head -3
          kpsewhich jlreq.cls
      - name: Execute real TeX reference and verify its measured glue
        run: |
          mkdir -p artifacts
          npm run bench:latex | tee artifacts/tex-reference-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suushiki-lualatex-reference
          path: artifacts/tex-reference-report.txt
          retention-days: 14
