name: test

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax check browser modules
        run: |
          node --check public/document-source.js
          node --check public/document-layout.js
          node --check public/document-render.js
          node --check public/document-workbench.js
